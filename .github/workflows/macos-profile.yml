# Temporary diagnostic for #894: where macOS test time goes. Removed before
# the PR merges; docs/ci-performance.md records its runs and numbers.
name: macOS profile

on:
  push:
    branches: [issue-894-profile]

jobs:
  profile:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [spotlight-off, apple-git]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Spotlight off
        if: matrix.variant == 'spotlight-off'
        run: sudo mdutil -a -i off
      - name: Apple git first on PATH
        if: matrix.variant == 'apple-git'
        run: |
          mkdir -p "$HOME/apple-git"
          ln -s "$(dirname "$(xcrun -f git)")"/git* "$HOME/apple-git/"
          ls -l "$HOME/apple-git"
          echo "$HOME/apple-git" >> "$GITHUB_PATH"
      - name: Build the tests
        run: cargo nextest run --no-run
      - run: git --version
      - name: Shard
        run: cargo nextest run --no-fail-fast --partition hash:${{ matrix.shard }}/4
