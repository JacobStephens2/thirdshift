# Temporary diagnostic for #894: where macOS test time goes. Removed before
# the PR merges; docs/ci-performance.md records its runs and numbers.
name: macOS profile

on:
  push:
    branches: [issue-894-profile]

jobs:
  profile:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Build the tests
        run: cargo nextest run --no-run
      - run: git --version
      - name: Programs, fsync and CPU under dtrace
        run: python3 .github/profile/profile.py .github/profile/rest-${{ matrix.part }}.txt --dtrace
