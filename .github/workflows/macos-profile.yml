# Temporary diagnostic for #894: where macOS test time goes. Removed before
# the PR merges; docs/ci-performance.md records its runs and numbers.
name: macOS profile

on:
  push:
    branches: [issue-894-profile]

jobs:
  profile:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        part: [spotlight-off, shard-1, shard-2, shard-3, shard-4]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Spotlight off
        run: sudo mdutil -a -i off
      - name: Apple git first on PATH
        if: startsWith(matrix.part, 'shard')
        run: |
          mkdir -p "$HOME/apple-git"
          ln -s "$(xcrun -f git)" "$HOME/apple-git/git"
          echo "$HOME/apple-git" >> "$GITHUB_PATH"
      - name: Build the tests
        run: cargo nextest run --no-run
      - run: git --version
      - name: Each traced test alone, wall against CPU
        if: matrix.part == 'spotlight-off'
        run: python3 .github/profile/profile.py .github/profile/dtrace.txt
      - name: Shard
        if: startsWith(matrix.part, 'shard')
        env:
          MATRIX_PART: ${{ matrix.part }}
        run: cargo nextest run --partition hash:${MATRIX_PART#shard-}/4
