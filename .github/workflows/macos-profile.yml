# Temporary diagnostic for #894: where macOS test time goes. Removed before
# the PR merges; docs/ci-performance.md records its runs and numbers.
name: macOS profile

on:
  push:
    branches: [issue-894-profile]

jobs:
  profile:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        part: [rusage-a, rusage-b, dtrace, parallelism]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: false
      - uses: taiki-e/install-action@nextest
      - name: Build the tests
        run: cargo nextest run --no-run
      - name: Runner
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          echo "PATH=$PATH"
          which -a git
          git --version
          /usr/bin/git --version || true
          csrutil status || true
      - name: Spawn costs
        if: matrix.part == 'dtrace'
        run: |
          rustc --edition 2024 --crate-name fakes -C debuginfo=0 -o /tmp/fakes-debug tests/fakes.rs
          rustc --edition 2024 --crate-name fakes -C debuginfo=0 -C opt-level=2 -o /tmp/fakes-opt tests/fakes.rs
          cargo build
          python3 .github/profile/spawn.py /tmp/fakes "$PWD/target/debug/thirdshift"
      - name: Each slow test alone, wall against CPU
        if: startsWith(matrix.part, 'rusage')
        run: python3 .github/profile/profile.py .github/profile/slow-${MATRIX_PART#rusage-}.txt
        env:
          MATRIX_PART: ${{ matrix.part }}
      - name: Programs and sleeps under dtrace
        if: matrix.part == 'dtrace'
        run: python3 .github/profile/profile.py .github/profile/dtrace.txt --dtrace
      - name: One spec_run partition at 3 and 6 threads
        if: matrix.part == 'parallelism'
        run: |
          for threads in 3 6; do
            /usr/bin/time -l cargo nextest run -E 'binary_id(thirdshift::spec_run)' --partition hash:1/3 -j $threads 2>&1 | grep -E 'Summary|real|user|sys|maximum resident' || true
          done
