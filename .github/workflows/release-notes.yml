# Sets the GitHub Release body to the bump PR's summary, then notes generated
# from the merged pull requests, then dist's install instructions; a tag with
# no bump PR summary gets the generated notes and install instructions alone.
# scripts/release-notes.sh builds the body. dist's release.yml calls this once
# the Release is published. There is no CHANGELOG file.
name: Release notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  release-notes:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      INSTALL_NOTES: ${{ fromJson(inputs.plan).announcement_github_body }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      # The script builds the body from the plan and the bump PR rather than
      # the current body, so a re-run doesn't repeat the notes.
      - run: |
          scripts/release-notes.sh "$TAG" "$INSTALL_NOTES" > notes.md
          gh release edit "$TAG" --notes-file notes.md
