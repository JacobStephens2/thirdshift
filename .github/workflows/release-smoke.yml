# Runs the built musl binaries' `thirdshift version` on the Linux platforms they
# have to start on, before the GitHub Release is created. dist's release.yml
# calls this after the builds, and its host job only publishes if it passes.
#
# On a tag push it always runs. On a pull request it only runs when the pull
# request touches the release pipeline, the dependencies or the Rust toolchain
# pin, so ordinary pull requests don't pay for the slow Rocky and WSL jobs.
name: Release smoke tests

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  ARCHIVE: thirdshift-x86_64-unknown-linux-musl
  ARTIFACT: artifacts-build-local-x86_64-unknown-linux-musl
  EXPECTED: thirdshift ${{ fromJson(inputs.plan).releases[0].app_version }}

jobs:
  gate:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
      arm-archive: ${{ steps.arm.outputs.archive }}
      arm-artifact: ${{ steps.arm.outputs.artifact }}
    steps:
      # A pull request's merge commit has the base branch as its first
      # parent, so diffing the two gives exactly the pull request's changes.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
              grep -qxE '\.github/workflows/release.*\.yml|scripts/release-dns\.sh|dist-workspace\.toml|rust-toolchain\.toml|Cargo\.(toml|lock)'
          then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - id: arm
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          archive=$(jq -er '.artifacts[] | select(.kind == "executable-zip" and (.target_triples | index("aarch64-unknown-linux-musl"))) | .name' <<< "$PLAN")
          targets=$(jq -er '.ci.github.artifacts_matrix.include[] | select(.targets | index("aarch64-unknown-linux-musl")) | .targets | join("_")' <<< "$PLAN")
          echo "archive=${archive%.tar.xz}" >> "$GITHUB_OUTPUT"
          echo "artifact=artifacts-build-local-$targets" >> "$GITHUB_OUTPUT"

  arm-linux:
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      ARCHIVE: ${{ needs.gate.outputs.arm-archive }}
      ARTIFACT: ${{ needs.gate.outputs.arm-artifact }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
      - name: Check the ARM binary is statically linked
        run: |
          tar -xJf "$ARCHIVE.tar.xz"
          file "$ARCHIVE/thirdshift" | tee /dev/stderr | grep -qE 'static(ally|-pie)? linked'
      - name: Run thirdshift version on ARM Linux
        run: |
          actual=$("$ARCHIVE/thirdshift" version)
          echo "$actual"
          [ "$actual" = "$EXPECTED" ]

  rocky:
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
      - name: Check the binary is statically linked
        run: |
          tar -xJf "$ARCHIVE.tar.xz"
          file "$ARCHIVE/thirdshift" | tee /dev/stderr | grep -qE 'static(-pie)? linked'
      - name: Run thirdshift version in a Rocky Linux 9 container
        run: |
          actual=$(docker run --rm -v "$PWD/$ARCHIVE:/opt/thirdshift:ro" rockylinux:9 \
            sh -c 'cat /etc/rocky-release >&2 && /opt/thirdshift/thirdshift version')
          echo "$actual"
          [ "$actual" = "$EXPECTED" ]

  wsl:
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    env:
      # Passes these variables from Windows into WSL.
      WSLENV: ARCHIVE:EXPECTED
    steps:
      - name: Resolve Ubuntu download and package hosts
        shell: pwsh
        run: |
          $ubuntuHosts = @('releases.ubuntu.com', 'archive.ubuntu.com', 'security.ubuntu.com')
          try {
            foreach ($hostname in $ubuntuHosts) {
              $addresses = [System.Net.Dns]::GetHostAddresses($hostname)
              if ($addresses.Count -eq 0) { throw "No addresses for $hostname" }
            }
            Write-Host 'Ubuntu hosts resolve through runner DNS'
          } catch {
            Write-Host 'Runner DNS failed for Ubuntu; using public DNS on this disposable runner'
            $interfaces = Get-NetIPConfiguration | Where-Object { $null -ne $_.IPv4DefaultGateway }
            if (-not $interfaces) { throw 'No network interface with an IPv4 default gateway' }
            foreach ($interface in $interfaces) {
              Set-DnsClientServerAddress -InterfaceIndex $interface.InterfaceIndex -ServerAddresses @('1.1.1.1', '8.8.8.8')
            }
            Clear-DnsClientCache
            foreach ($hostname in $ubuntuHosts) {
              [System.Net.Dns]::GetHostAddresses($hostname) | Out-Null
            }
          }
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: xz-utils
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
      - name: Run thirdshift version in WSL2 with Ubuntu 24.04
        run: |
          grep -q WSL2 /proc/version
          grep PRETTY_NAME /etc/os-release
          # Install onto the Linux filesystem, as users must, not /mnt/c.
          tar -xJf "$ARCHIVE.tar.xz" -C "$HOME"
          actual=$("$HOME/$ARCHIVE/thirdshift" version)
          echo "$actual"
          [ "$actual" = "$EXPECTED" ]
