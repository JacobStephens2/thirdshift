name: CI

on:
  push:
    branches: [main]
  # `labeled` lets `test:linux-arm` start its full suite on a
  # PR's current head. Any label starts a whole new run, which cancels an
  # older one still running under the concurrency group below.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Nightly, on main: the full ARM Linux suite covers what ordinary
  # PRs don't run. GitHub tells the user who last changed this cron when
  # it fails; see docs/ci-performance.md for what to do then.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# PR numbers distinguish fork branches. Unique non-PR groups also preserve
# pending main runs, which GitHub would otherwise replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner images are pinned to the platforms thirdshift supports.
# Job limits bound hangs in CI watch; measured runtimes and headroom are in
# docs/ci-performance.md.
jobs:
  console-test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm test
        working-directory: console

  site-test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version and components rust-toolchain.toml names
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Check the Release workflow generator
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          python3 scripts/generate-release.py --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The tests run the binary against real git and fake gh and claude,
      # which the tests build from tests/fakes.rs with rustc.
      # nextest fills idle slots across test binaries (#1317). Keep the
      # contributor's cargo test path exercised by the nightly run too.
      - uses: taiki-e/install-action@nextest
        if: ${{ github.event_name != 'schedule' }}
      - run: cargo nextest run
        if: ${{ github.event_name != 'schedule' }}
      - run: cargo test
        if: ${{ github.event_name == 'schedule' }}

  # One stable check name. Full ARM Linux coverage on main, nightly and manual
  # runs; PRs into main opt in with `test:linux-arm` (#1663).
  test-linux-arm:
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || (github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'test:linux-arm')) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version and components rust-toolchain.toml names
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
        if: ${{ github.event_name != 'schedule' }}
      - run: cargo nextest run
        if: ${{ github.event_name != 'schedule' }}
      - run: cargo test
        if: ${{ github.event_name == 'schedule' }}
