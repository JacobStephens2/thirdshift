name: CI

on:
  push:
    branches: [main]
  # `labeled` lets `test:linux-arm` start its full suite on a
  # PR's current head. Any label starts a whole new run, which cancels an
  # older one still running under the concurrency group below.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Nightly, on main: the full ARM Linux suite covers what ordinary
  # PRs don't run. GitHub tells the user who last changed this cron when
  # it fails; see docs/ci-performance.md for what to do then.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      benchmark:
        description: Compare one, two and four independent cached builds on both Linux runners
        type: boolean
        default: false
      probe:
        description: Exercise the stable gates without running the suite (manual diagnostics only)
        type: choice
        options: [none, failure, skipped]
        default: none

# PR numbers distinguish fork branches. Unique non-PR groups also preserve
# pending main runs, which GitHub would otherwise replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner images are pinned to the platforms thirdshift supports.
# Job limits bound hangs in CI watch; measured runtimes and headroom are in
# docs/ci-performance.md.
jobs:
  console-test:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Ubuntu package hosts
        run: bash scripts/release-dns.sh
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm test
        working-directory: console

  site-test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Ubuntu package hosts
        working-directory: .
        run: bash scripts/release-dns.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  rust-x86:
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04
      partitions: '[1]'
      artifact: rust-x86
      checks: true
      nightly: ${{ github.event_name == 'schedule' }}
      probe: ${{ inputs.probe || 'none' }}

  test:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: rust-x86
    if: ${{ always() }}
    steps:
      - name: Require all x86 work
        env:
          RESULT: ${{ needs.rust-x86.result }}
        run: test "$RESULT" = success

  # One stable check name. Full ARM Linux coverage on main, nightly and manual
  # runs; PRs into main opt in with `test:linux-arm` (#1663).
  rust-arm:
    if: ${{ github.event_name != 'pull_request' || (github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'test:linux-arm')) }}
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04-arm
      partitions: '[1]'
      artifact: rust-arm
      nightly: ${{ github.event_name == 'schedule' }}
      probe: ${{ inputs.probe || 'none' }}

  test-linux-arm:
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    needs: rust-arm
    if: ${{ always() && (github.event_name != 'pull_request' || (github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'test:linux-arm'))) }}
    steps:
      - name: Require all ARM work
        env:
          RESULT: ${{ needs.rust-arm.result }}
        run: test "$RESULT" = success

  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        partitions: ['[1]', '[1,2]', '[1,2,3,4]']
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ${{ matrix.runner }}
      partitions: ${{ matrix.partitions }}
      artifact: benchmark-${{ matrix.runner }}-${{ strategy.job-index }}
      clippy: false

  benchmark-report:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: benchmark
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Collect job and step timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir benchmark-report
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > benchmark-report/run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.[].jobs[]]' > benchmark-report/jobs.json
          python3 scripts/ci-timings.py benchmark benchmark-report >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: benchmark-report
          path: benchmark-report/
          retention-days: 14
          overwrite: true
