name: CI

on:
  push:
    branches: [main]
  # `labeled` lets the `test:macos` label start the full macOS suite on a
  # PR's current head. Any label starts a whole new run, which cancels an
  # older one still running under the concurrency group below.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Nightly, on main: the full macOS suite catches what the PR gate's
  # filterset misses. GitHub tells the user who last changed this cron when
  # it fails; see docs/ci-performance.md for what to do then.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# PR numbers distinguish fork branches. Unique non-PR groups also preserve
# pending main runs, which GitHub would otherwise replace.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name != 'pull_request' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner images are pinned to the platforms thirdshift supports.
jobs:
  console-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm test
        working-directory: console

  site-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version and components rust-toolchain.toml names
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Check the Release workflow generator
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          python3 scripts/generate-release.py --check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The tests run the binary against real git and fake gh and claude,
      # which the tests build from tests/fakes.rs with rustc.
      # nextest fills idle slots across test binaries (#1317). Keep the
      # contributor's cargo test path exercised by the nightly run too.
      - uses: taiki-e/install-action@nextest
        if: ${{ github.event_name != 'schedule' }}
      - run: cargo nextest run
        if: ${{ github.event_name != 'schedule' }}
      - run: cargo test
        if: ${{ github.event_name == 'schedule' }}

  # Which macOS work this event gets (#893, docs/ci-performance.md): the full
  # suite on pushes to main, nightly, by hand or for a PR into main labelled
  # `test:macos`; the gate for any other PR into main; none for a PR into
  # another base, such as a Spec branch.
  macos-plan:
    runs-on: ubuntu-24.04
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'test:macos') }}
        run: |
          if [ "$EVENT" != pull_request ]; then suite=full
          elif [ "$BASE" != main ]; then suite=none
          elif [ "$LABELLED" = true ]; then suite=full
          else suite=gate
          fi
          echo "macOS suite: $suite"
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

  # One macOS job: clippy for the macOS target and the tests of the
  # macOS-specific code, which the macos-gate profile in .config/nextest.toml
  # selects.
  test-macos-gate:
    needs: macos-plan
    if: ${{ needs.macos-plan.outputs.suite == 'gate' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version and components rust-toolchain.toml names
        run: |
          rustup toolchain install
          rustc --version
      # Restore what the full suite saved on main; a gate's narrower build
      # saved under the same key would leave a labelled PR's shards without it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: false
      # The same two changes as the shards below make; see there.
      - name: Turn Spotlight indexing off
        run: sudo mdutil -a -i off
      - name: Put Xcode's git first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/xcode-git"
          ln -s "$(dirname "$(xcrun -f git)")"/git* "$RUNNER_TEMP/xcode-git/"
          echo "$RUNNER_TEMP/xcode-git" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcode-git/git" --version
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --profile macos-gate

  test-macos-shard:
    needs: macos-plan
    if: ${{ needs.macos-plan.outputs.suite == 'full' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version rust-toolchain.toml names
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-macos
          save-if: ${{ matrix.shard == 1 }}
      # The tests spend most of their time starting git (#894,
      # docs/ci-performance.md). Spotlight indexes every repository they
      # create, taking CPU from them on the 3-core runner.
      - name: Turn Spotlight indexing off
        run: sudo mdutil -a -i off
      # Homebrew's git, first on the image's PATH, takes about 13 ms to run
      # here and Xcode's about 9 ms. Xcode's git runs git-upload-pack and
      # the rest only from beside itself, so they are linked here too.
      - name: Put Xcode's git first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/xcode-git"
          ln -s "$(dirname "$(xcrun -f git)")"/git* "$RUNNER_TEMP/xcode-git/"
          echo "$RUNNER_TEMP/xcode-git" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcode-git/git" --version
      # nextest runs tests from every test binary in parallel, where cargo test
      # runs the binaries one after another; that matters on the slower macOS
      # runners. Without a lib target there are no doctests for it to miss.
      # Linux also uses nextest, except for its nightly cargo test run.
      - uses: taiki-e/install-action@nextest
      # Hash partitions cover the same suite once across all four runners.
      # Pushes to main report every failure in a shard in the same run (#1325).
      - run: cargo nextest run --partition hash:${{ matrix.shard }}/${{ strategy.job-total }} ${{ github.event_name == 'push' && '--no-fail-fast' || '' }}

  # Keep one stable check name on every run. It requires what the plan
  # asked for: every shard passed, or the gate passed, or, with no macOS work,
  # both were skipped. A failed, cancelled or wrongly skipped job fails it.
  test-macos:
    needs: [macos-plan, test-macos-gate, test-macos-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the macOS work the plan asked for to pass
        env:
          SUITE: ${{ needs.macos-plan.outputs.suite }}
          GATE: ${{ needs.test-macos-gate.result }}
          SHARDS: ${{ needs.test-macos-shard.result }}
        run: |
          echo "plan: ${SUITE:-none made}, gate: $GATE, shards: $SHARDS"
          case "$SUITE" in
            full) test "$SHARDS" = success ;;
            gate) test "$GATE" = success ;;
            none) test "$GATE" = skipped && test "$SHARDS" = skipped ;;
            *) exit 1 ;;
          esac
