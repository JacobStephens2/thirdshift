name: Issue label to project status

on:
  issues:
    types: [labeled, unlabeled]
  # Synchronize a pull request's own card when it opens or its in-progress
  # label changes, and the issues it closes when it opens or its body changes.
  # Only issue and project data is read; no pull request code is checked out,
  # so pull_request_target is safe here.
  pull_request_target:
    types: [opened, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or pull request number to synchronize
        required: true
        type: number

permissions: {}

concurrency:
  group: issue-project-status-${{ github.event.issue.number || inputs.issue_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-status:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'in-progress'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A user project requires a separate token; GITHUB_TOKEN cannot access it.
      # PROJECT_STATUS_TOKEN must be able to read issues and write Projects.
      - name: Match project status to the in-progress label
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ITEM_NUMBER: ${{ github.event.issue.number || inputs.issue_number || github.event.pull_request.number }}
          PR_ACTION: ${{ github.event_name == 'pull_request_target' && github.event.action || '' }}
          PROJECT_ID: PVT_kwHOAzaH4M4BmapY
          STATUS_FIELD_ID: PVTSSF_lAHOAzaH4M4BmapYzhlDz3Y
          TODO_OPTION_ID: f75ad846
          IN_PROGRESS_OPTION_ID: 47fc9ee4
          PR_OPEN_OPTION_ID: ca510e75
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Configure the PROJECT_STATUS_TOKEN repository secret with Projects write access.'
            exit 1
          fi

          # Read the item's project card and Status, and whether an open pull
          # request stands for its work: the item itself when it is an open
          # pull request, or an open pull request that closes the issue.
          read_item() {
            gh api graphql --paginate --slurp -f id="$1" -f query='
              query($id: ID!, $endCursor: String) {
                node(id: $id) {
                  ... on Issue {
                    projectItems(first: 100, after: $endCursor) {
                      nodes {
                        id
                        project { id }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                    closedByPullRequestsReferences(first: 20) {
                      nodes { state }
                    }
                  }
                  ... on PullRequest {
                    state
                    projectItems(first: 100, after: $endCursor) {
                      nodes {
                        id
                        project { id }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }'
          }

          sync_item() {
            # Read the current item rather than trusting a possibly stale event.
            item=$(gh api "repos/$GH_REPO/issues/$1")
            if ! jq -e '.state == "open"' <<< "$item" >/dev/null; then
              echo "#$1 is closed; no change."
              return 0
            fi
            claimed=$(jq -r '.labels | any(.name == "in-progress")' <<< "$item")
            node_id=$(jq -r '.node_id' <<< "$item")

            find_card() {
              data=$(read_item "$node_id")
              read -r item_id current < <(jq -r --arg project "$PROJECT_ID" '
                [.[].data.node.projectItems.nodes[]
                  | select(.project.id == $project)
                  | "\(.id) \(.fieldValueByName.optionId // "")"] | first // ""' <<< "$data")
            }
            find_card
            if [[ -z "${item_id:-}" && "${2:-}" == wait ]]; then
              # A just-opened pull request may not be on the board yet.
              sleep 30
              find_card
            fi
            if [[ -z "${item_id:-}" ]]; then
              echo "#$1 is not in the thirdshift project; no change."
              return 0
            fi

            # A live Claim, or a Review or Fix run's reservation, puts a Todo or
            # PR open card In Progress. Without one, an open pull request that
            # stands for the work puts a Todo or In Progress card in PR open;
            # with none, an In Progress card goes back to Todo. Other statuses
            # are left alone.
            if [[ "$claimed" == true ]]; then
              [[ "$current" == "$TODO_OPTION_ID" || "$current" == "$PR_OPEN_OPTION_ID" ]] || {
                echo "#$1 is claimed but not in Todo or PR open; no change."; return 0; }
              target=$IN_PROGRESS_OPTION_ID; target_name='In Progress'
            elif jq -e '.[0].data.node | .state == "OPEN"
                or ([.closedByPullRequestsReferences.nodes[]? | select(.state == "OPEN")] | length > 0)' \
                <<< "$data" >/dev/null; then
              [[ "$current" == "$TODO_OPTION_ID" || "$current" == "$IN_PROGRESS_OPTION_ID" ]] || {
                echo "#$1 has an open pull request but is not in Todo or In Progress; no change."; return 0; }
              target=$PR_OPEN_OPTION_ID; target_name='PR open'
            else
              [[ "$current" == "$IN_PROGRESS_OPTION_ID" ]] || {
                echo "#$1 is unclaimed without an open pull request and not In Progress; no change."; return 0; }
              target=$TODO_OPTION_ID; target_name='Todo'
            fi

            gh api graphql --silent -f project="$PROJECT_ID" -f item="$item_id" \
              -f field="$STATUS_FIELD_ID" -f option="$target" -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }'
            echo "Moved #$1 to $target_name."
          }

          case "$PR_ACTION" in
            opened | reopened) sync_item "$ITEM_NUMBER" wait ;;
            *) sync_item "$ITEM_NUMBER" ;;
          esac

          case "$PR_ACTION" in
            opened | reopened | edited)
              # The issues this pull request closes, as GitHub has linked them.
              issues=$(gh pr view "$ITEM_NUMBER" --repo "$GH_REPO" \
                --json closingIssuesReferences \
                --jq ".closingIssuesReferences[]
                  | select(\"\\(.repository.owner.login)/\\(.repository.name)\" == \"$GH_REPO\")
                  | .number")
              for number in $issues; do
                sync_item "$number"
              done
              ;;
          esac
