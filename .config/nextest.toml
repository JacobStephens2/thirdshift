[profile.default]
# The retrospective's long tail starts at 60 seconds. Warn at half that
# budget so growing scenarios surface before joining it. Reporting only:
# no termination, failure suppression, or retries. See docs/ci-performance.md.
slow-timeout = "30s"
status-level = "slow"
final-status-level = "slow"

# The macOS gate on pull requests into main runs only these tests (#893);
# the full suite runs on macOS on pushes to main, nightly and with the
# `test:macos` label. See docs/ci-performance.md. The filter must cover the
# tests of every macOS-specific code path, so add new ones here:
# - `#[cfg(target_os = "macos")]` process identity (src/logs/process_identity.rs),
#   read by the logs unit tests and used to signal by `thirdshift stop`;
# - the non-Linux skills directory handle (src/skills/directory.rs);
# - the `cfg!(target_os = "linux")` branches in child Run handling
#   (src/child_run.rs), started from the executable's path by a Spec run.
[profile.macos-gate]
default-filter = """
(binary_id(thirdshift::bin/thirdshift) & test(/^(logs|skills|child_run)::/))
| binary_id(thirdshift::stop)
| (binary_id(thirdshift::spec_run) & (
    test(=a_linear_spec_lands_each_ticket_in_order_then_opens_a_ready_spec_pr)
    | test(=a_signal_to_the_spec_run_alone_fails_the_ticket_run_then_ends_the_spec_run_as_interrupted)
))
"""
