[profile.default]
# The retrospective's long tail starts at 60 seconds. Warn at half that
# budget so growing scenarios surface before joining it. Reporting only:
# no termination, failure suppression, or retries. See docs/ci-performance.md.
slow-timeout = "30s"
status-level = "slow"
final-status-level = "slow"

# The macOS gate on pull requests into main runs only these tests (#893);
# docs/ci-performance.md says which runs get the full suite instead. The
# filter must cover the tests of the macOS-specific code, so add the tests
# of new macOS-specific code here:
# - `#[cfg(target_os = "macos")]` process identity (src/logs/process_identity.rs),
#   read by the logs unit tests and used to signal by `thirdshift stop`;
# - the non-Linux skills directory handle (src/skills/directory.rs);
# - the `cfg!(target_os = "linux")` branches in child Run handling
#   (src/child_run.rs), started from the executable's path by a Spec run.
# - native Console process-exit notifications (src/console/watching.rs),
#   exercised through HTTP by tests/console/watching.rs.
# - canonical filesystem event paths from macOS FSEvents (src/console/changes.rs),
#   exercised by command pushes, account revocation and executable replacement.
# - Setup's non-Linux sandbox guidance (src/setup/sandbox.rs), exercised by
#   its platform-independent wording tests and tests/setup.rs.
# - detached Harness cleanup on macOS (src/process/session.rs), exercised
#   through Session recording, including the macOS-only nohup fixture.
# - vanished-process handling and platform-independent manager probing,
#   exercised directly at the marker sweep and scope availability seams.
# The console installer's Linux-only refusal (src/console/install.rs) has no
# test that runs off Linux, so nothing here covers it.
[profile.macos-gate]
default-filter = """
(binary_id(thirdshift::bin/thirdshift) & test(/^(logs|skills|child_run)::/))
| binary_id(thirdshift::stop)
| (binary_id(thirdshift::bin/thirdshift) & test(/^console::changes::tests::/))
| (binary_id(thirdshift::bin/thirdshift) & test(/^setup::sandbox::tests::/))
| (binary_id(thirdshift::bin/thirdshift) & test(/^session::recording::lifetime_tests::/))
| (binary_id(thirdshift::bin/thirdshift) & test(/^process::session::tests::/))
| (binary_id(thirdshift::bin/thirdshift) & test(=scope::tests::availability_probes_the_manager_on_every_platform))
| (binary_id(thirdshift::bin/thirdshift) & test(=session::private::tests::scoring_uses_an_ordinary_session_without_memory_caps_and_registers_its_command_models))
| (binary_id(thirdshift::setup) & test(=security_sandbox_unavailable_report_preserves_saved_settings))
| (binary_id(thirdshift::console) & (
    test(/^watching::/)
    | test(=command_changes_push_events_over_http)
    | test(=accounts::cli_and_allowlist_changes_revoke_http_sessions_without_deleting_the_account)
    | test(=accounts::an_open_inbox_stream_closes_when_its_session_is_revoked)
    | test(=accounts::an_open_log_stream_closes_when_cli_sign_out_revokes_its_session)
    | test(=replacing_the_binary_executes_the_replacement_with_the_original_arguments)
))
| (binary_id(thirdshift::spec_run) & (
    test(=a_linear_spec_lands_each_ticket_in_order_then_opens_a_ready_spec_pr)
    | test(=a_signal_to_the_spec_run_alone_fails_the_ticket_run_then_ends_the_spec_run_as_interrupted)
))
"""
