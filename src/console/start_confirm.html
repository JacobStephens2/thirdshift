<dialog id="start-confirm" aria-labelledby="start-confirm-title">
  <h2 id="start-confirm-title">Confirm start</h2>
  <p data-start-description></p>
  <pre data-start-summary></pre>
  <p>Omitted options use User config and the CLI defaults. This starts work now and can spend Harness subscriptions. A Pass keeps its usual skip checks.</p>
  <button type="button" data-start-cancel>Cancel</button>
  <button type="button" data-start-accept>Start now</button>
</dialog>
