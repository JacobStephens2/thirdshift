<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · thirdshift</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/console.css"></head>
<body><header><p class="brand">thirdshift / Console</p><h1>Sign in</h1></header><main>
<form method="post" action="/sign-in">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Email <input name="email" type="email" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
<p>Need a password? Ask the machine's owner to run <code>thirdshift console password --email &lt;address&gt;</code>.</p>
</main></body></html>
