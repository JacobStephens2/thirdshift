<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Console log · thirdshift</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/console.css"></head>
<body><header><p class="brand">thirdshift / Console</p><nav aria-label="Pages"><a href="/">Inbox</a><a href="/account">Account</a></nav></header><main>
