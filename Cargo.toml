[package]
name = "thirdshift"
version = "0.14.6"
edition = "2024"
description = "Turn a GitHub issue into a ready-for-review pull request, unattended"
license = "MIT"
repository = "https://github.com/JacobStephens2/thirdshift"
homepage = "https://thirdshift.app"
# The crate carries the sources and the Factory skills the binary embeds;
# the repository's agent tooling, docs and tests stay out of it.
include = ["/src", "/skills", "/askama.toml", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "form", "json"] }
# axoupdater needs axoasset's `remote` feature, which always pulls in `image`
# (with moxcms and pxfm) and turns on reqwest's `default-tls`, which is rustls
# with aws-lc. No flag turns either off, and features unify, so switching
# reqwest below to ring (`rustls-no-provider` plus rustls's `ring`) would
# build ring as well as aws-lc, not instead of it. Dropping either stack
# needs an axoasset change or another updater (#174).
axoupdater = { version = "0.10.2", default-features = false, features = ["github_releases", "blocking"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
include_dir = "0.7.4"
libc = "0.2.189"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json", "form"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
# OTLP must preserve f64 values and parse decimal integers without an f64 hop.
serde_json = { version = "1.0.151", features = ["float_roundtrip", "arbitrary_precision"] }
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
subtle = "2.6.1"
signal-hook = "0.4.4"
tempfile = "3.27.0"
toml = "1.1.6"
toml_edit = "0.25.15"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "logs", "trace", "with-serde"] }
stateright = "=0.31.0"
tower-layer = "0.3.3"

# Line tables keep file and line in the crate's backtraces, and dependencies
# get no debuginfo, so their frames show no file or line. Full debuginfo made
# the debug binary 108MB and target/ 1.5GB per worktree.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
