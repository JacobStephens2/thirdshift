[package]
name = "thirdshift"
version = "0.2.0"
edition = "2024"
description = "Turn a GitHub issue into a ready-for-review pull request, unattended"
license = "MIT"
repository = "https://github.com/JacobStephens2/thirdshift"
# homepage stays unset until thirdshift.app is live.
# The crate carries the sources and the Factory skills the binary embeds;
# the repository's agent tooling, docs and tests stay out of it.
include = ["/src", "/skills", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
axoupdater = { version = "0.10.2", default-features = false, features = ["github_releases", "blocking"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
include_dir = "0.7.4"
libc = "0.2.189"
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
